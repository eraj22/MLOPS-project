global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/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"

route:
  receiver: "slack-notifications"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 15m

receivers:
  - name: "slack-notifications"
    slack_configs:
      - channel: "#all-mlops-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
