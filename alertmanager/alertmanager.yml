global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"

route:
  receiver: "slack-notifications"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 15m

receivers:
  - name: "slack-notifications"
    slack_configs:
      - channel: "#all-mlops-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
